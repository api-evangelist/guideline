aid: guideline
name: Guideline
description: >-
  Guideline (now offered as "Gusto 401(k) powered by Guideline") is a retirement
  benefits provider that delivers full-service, low-cost 401(k) and IRA plans to
  small and mid-sized businesses, tightly integrated with payroll so employee
  deductions and employer contributions sync automatically. Through its
  SEC-registered investment adviser subsidiary it offers managed, low-cost
  index-fund portfolios, recordkeeping, compliance and plan administration.
  Guideline reports serving 40,000+ businesses and 700,000+ savers with $10B+ in
  assets under management. It exposes no public developer API; this profile
  captures its identity, security posture, and machine-readable surfaces
  (security.txt, llms.txt) for the API Evangelist network.
